name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Generate, test, and verify queries
    runs-on: ${{ matrix.os }}
    environment: public-ci
    env:
      RUSTC_WRAPPER: sccache
      SCCACHE_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      SCCACHE_REGION: "auto"
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_SCCACHE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SCCACHE_SECRET_ACCESS_KEY }}
      CARGO_INCREMENTAL: 0
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # --ignore-scripts skips install scripts, including the one that
      # downloads the tree-sitter-cli binary; rebuild just that package.
      - name: Install tree-sitter CLI binary
        run: npm rebuild tree-sitter-cli

      # Two-mode by design, unlike dekaruntime/deka's loud failure: the R2
      # secrets exist only in deka's public-ci environment and are
      # staff-only, so when they are absent here (auto-created empty
      # environment) we warn and fall back to sccache's local disk cache
      # rather than failing the job. Do NOT "fix" this back to an
      # unconditional exit 1. The sccache binary itself stays mandatory:
      # job-level RUSTC_WRAPPER applies to every compile in this job
      # (cargo, the Rust cc crate used by tree-sitter test/generate, and
      # node-gyp), so the setup must precede the first compile step.
      - name: Configure sccache bucket
        run: |
          if [ -n "$AWS_ACCESS_KEY_ID" ] && [ -n "$AWS_SECRET_ACCESS_KEY" ] && [ -n "$SCCACHE_ENDPOINT" ]; then
            # Bucket is architecture-specific; derive it from the host.
            case "$(uname -s)-$(uname -m)" in
              Darwin-arm64)  BUCKET=deka-sccache-darwin-arm64 ;;
              Darwin-x86_64) BUCKET=deka-sccache-darwin-x64 ;;
              Linux-x86_64)  BUCKET=deka-sccache-linux-x64 ;;
              *) echo "unsupported sccache host: $(uname -sm)" >&2; exit 1 ;;
            esac
            echo "SCCACHE_BUCKET=$BUCKET" >> "$GITHUB_ENV"
            echo "sccache bucket: $BUCKET"
          else
            echo "::warning::R2 sccache credentials are not configured in this repository yet; sccache will use its local disk cache. Add R2_ENDPOINT / R2_SCCACHE_ACCESS_KEY_ID / R2_SCCACHE_SECRET_ACCESS_KEY to the public-ci environment to enable the shared bucket (same names as dekaruntime/deka)."
          fi

      # Installs the sccache binary; must come after bucket config since
      # it receives the R2 bucket config from the environment.
      - name: Run sccache-cache
        uses: mozilla-actions/sccache-action@v0.0.9

      # sccache IS REQUIRED FOR ALL RUST COMPILATION; only the bucket is
      # optional here. A missing binary with RUSTC_WRAPPER set makes every
      # compile die with ENOENT, which reads as a code failure.
      - name: Verify sccache is on PATH
        run: |
          if ! command -v sccache >/dev/null 2>&1; then
            echo "::error::sccache is not on PATH. SCCACHE IS REQUIRED FOR ALL RUST COMPILATION."
            exit 1
          fi
          sccache --version

      - name: Verify generated parser is up to date
        run: |
          npx tree-sitter generate
          git diff --exit-code -- src/parser.c src/node-types.json src/grammar.json

      - name: Run corpus tests
        run: npx tree-sitter test

      - name: Verify queries compile
        run: |
          npx tree-sitter query queries/highlights.scm test/corpus/declarations.txt > /dev/null
          npx tree-sitter query queries/injections.scm test/corpus/declarations.txt > /dev/null
          npx tree-sitter query queries/locals.scm test/corpus/declarations.txt > /dev/null
          npx tree-sitter query queries/tags.scm test/corpus/declarations.txt > /dev/null

      - name: Build Node binding
        run: npm install --ignore-scripts && npx node-gyp rebuild

      - name: Test Rust binding
        run: cargo test

  wasm:
    name: Build WebAssembly parser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # --ignore-scripts skips install scripts, including the one that
      # downloads the tree-sitter-cli binary; rebuild just that package.
      - name: Install tree-sitter CLI binary
        run: npm rebuild tree-sitter-cli

      - name: Set up emscripten
        uses: mymindstorm/setup-emsdk@v14

      - name: Generate parser
        run: npx tree-sitter generate

      - name: Build wasm
        run: npx tree-sitter build --wasm

      - name: Upload wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: tree-sitter-deka.wasm
          path: tree-sitter-deka.wasm
