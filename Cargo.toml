[package]
name = "tree-sitter-deka"
description = "DekaScript (.ds, .dsx) grammar for tree-sitter"
version = "0.1.0"
authors = ["dekaruntime"]
license = "MIT"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "deka", "dekascript", "dsx"]
categories = ["parsing", "text-editors"]
repository = "https://github.com/dekaruntime/tree-sitter-deka"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "LICENSE",
  "bindings/rust",
  "grammar.js",
  "scanner",
  "src",
  "queries/*",
  "./tree-sitter.json",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.1"

[dev-dependencies]
tree-sitter = "0.25"
